<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三交代カレンダー v6</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #111827;
      --morning: #3b82f6;
      --evening: #f59e0b;
      --night: #8b5cf6;
      --off: #22c55e;
      --today: #3b82f6;
      --selected: #ef4444;
      --selected-bg: #fff1f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin: 0;
      letter-spacing: .02em;
    }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    button, select, input, textarea {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
      margin-bottom: 12px;
    }
    .today-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .today-title { font-size: 14px; color: var(--muted); }
    .today-date { font-size: 22px; font-weight: 800; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      border-radius: 999px;
      padding: 7px 10px;
      color: white;
      font-weight: 800;
      font-size: 14px;
      line-height: 1;
    }
    .morning { background: var(--morning); }
    .evening { background: var(--evening); }
    .night { background: var(--night); }
    .off { background: var(--off); }
    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .month-label { text-align: center; font-size: 20px; font-weight: 900; }
    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .settings label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .settings input, .settings select { width: 100%; }
    .weekdays, .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, calc((100% - 36px) / 7)));
      gap: 6px;
    }
    .weekdays div {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      padding: 4px 0;
    }
    .day {
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
      min-width: 0;
      max-width: 100%;
      width: 100%;
      overflow: hidden;
      padding-bottom: 20px;
    }
    .day.blank { background: transparent; border-color: transparent; box-shadow: none; }
    .day.today { border: 2px solid var(--today); padding: 5px; }
    .day.selected { border: 2px solid var(--selected); background: var(--selected-bg); padding: 5px; }
    .day.today.selected { box-shadow: inset 0 0 0 2px rgba(59,130,246,.25); }
    .date-num { font-size: 13px; font-weight: 800; }
    .day .pill { min-width: 0; width: 100%; max-width: 100%; font-size: 13px; padding: 6px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .memo-dot {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 5px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      text-align: left;
      pointer-events: none;
    }
    .sun { color: #ef4444; }
    .sat { color: #2563eb; }
    dialog {
      border: none;
      border-radius: 20px;
      padding: 0;
      width: min(92vw, 460px);
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
    }
    dialog::backdrop { background: rgba(15, 23, 42, .45); }
    .modal { padding: 16px; }
    .modal h2 { margin: 0 0 6px; font-size: 20px; }
    textarea { width: 100%; min-height: 120px; resize: vertical; margin: 10px 0; }
    .row { display: flex; gap: 8px; justify-content: flex-end; }
    .selected-card { padding: 12px 14px; }
    .selected-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .selected-title { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .selected-date { font-size: 18px; font-weight: 900; color: var(--text); text-align: right; }
    .all-teams {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 0;
    }
    .team-chip {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 4px;
      background: #fff;
      font-size: 12px;
      font-weight: 900;
      overflow: hidden;
      white-space: nowrap;
    }
    .team-chip b { color: var(--text); }
    .team-chip .pill { min-width: 38px; width: auto; font-size: 12px; padding: 5px 8px; }
    .legend { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .mini { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
    @media (max-width: 390px) {
      .app { padding: 10px; }
      .day { min-height: 64px; padding: 5px 5px 20px; }
      .day .pill { font-size: 12px; }
      .settings { grid-template-columns: 1fr; }
      .selected-date { font-size: 16px; }
      .team-chip { gap: 3px; padding: 4px 3px; }
      .team-chip .pill { min-width: 34px; padding: 5px 6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>三交代カレンダー</h1>
        <div class="sub">朝勤・夜勤・夕勤・休みを自動表示 <b>v6 選択日コンパクト版</b></div>
      </div>
      <button id="resetBtn" title="保存設定を初期化">初期化</button>
      <button id="todayBtn">今日</button>
    </header>

    <section class="card today-card">
      <div>
        <div class="today-title">今日の勤務</div>
        <div class="today-date" id="todayDate"></div>
        <div class="sub" id="nextOff"></div>
      </div>
      <div id="todayShift"></div>
    </section>

    <section class="card selected-card">
      <div class="selected-head">
        <div class="selected-title">選択日</div>
        <div class="selected-date" id="selectedDateLabel"></div>
      </div>
      <div id="allTeams" class="all-teams" aria-label="選択日の4班勤務"></div>
    </section>

    <section class="card">
      <div class="controls">
        <button id="prevBtn">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button id="nextBtn">›</button>
      </div>
      <div class="settings">
        <div>
          <label>班</label>
          <select id="teamSelect">
            <option value="A">A班</option>
            <option value="B">B班</option>
            <option value="C">C班</option>
            <option value="D">D班</option>
          </select>
        </div>
        <div>
          <label>基準日（A班が夕勤明け休みの日）</label>
          <input id="baseDate" type="date" value="2026-06-01" />
        </div>
      </div>
    </section>

    <section class="card">
      <div class="legend">
        <span><i class="mini morning"></i>朝勤</span>
        <span><i class="mini night"></i>夜勤</span>
        <span><i class="mini evening"></i>夕勤</span>
        <span><i class="mini off"></i>休み</span>
      </div>
      <div class="weekdays">
        <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>
  </main>

  <dialog id="memoDialog">
    <div class="modal">
      <h2 id="modalDate"></h2>
      <div id="modalShift"></div>
      <textarea id="memoInput" placeholder="予定やメモを入力"></textarea>
      <div class="row">
        <button id="deleteMemoBtn">削除</button>
        <button id="closeModalBtn">閉じる</button>
        <button class="primary" id="saveMemoBtn">保存</button>
      </div>
    </div>
  </dialog>

  <script>
    // 基準日: A班が「夕勤3日目の翌日の休み」になる日。
    // その同じ日に B=朝勤3日目、C=夜勤2日目、D=夕勤1日目 になる。
    const cycle = [
      { key: 'off', label: '休み', short: '休', day: '' },
      { key: 'morning', label: '朝勤1日目', short: '朝1', day: '1日目' },
      { key: 'morning', label: '朝勤2日目', short: '朝2', day: '2日目' },
      { key: 'morning', label: '朝勤3日目', short: '朝3', day: '3日目' },
      { key: 'off', label: '休み', short: '休', day: '' },
      { key: 'night', label: '夜勤1日目', short: '夜1', day: '1日目' },
      { key: 'night', label: '夜勤2日目', short: '夜2', day: '2日目' },
      { key: 'night', label: '夜勤3日目', short: '夜3', day: '3日目' },
      { key: 'off', label: '休み', short: '休', day: '' },
      { key: 'evening', label: '夕勤1日目', short: '夕1', day: '1日目' },
      { key: 'evening', label: '夕勤2日目', short: '夕2', day: '2日目' },
      { key: 'evening', label: '夕勤3日目', short: '夕3', day: '3日目' },
    ];
    const teamOffset = { A: 0, B: 3, C: 6, D: 9 };
    const $ = (id) => document.getElementById(id);
    const state = {
      view: new Date(),
      selectedDate: ymd(new Date()),
      memos: JSON.parse(localStorage.getItem('shiftMemos') || '{}')
    };

    function ymd(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function formatJaDate(date) { return `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} (${['日','月','火','水','木','金','土'][date.getDay()]})`; }
    function dateOnly(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
    function daysBetween(a, b) { return Math.round((dateOnly(a) - dateOnly(b)) / 86400000); }
    function mod(n, m) { return ((n % m) + m) % m; }
    function getShiftForTeam(date, team) {
      const base = new Date($('baseDate').value + 'T00:00:00');
      const idx = mod(daysBetween(date, base) + teamOffset[team], cycle.length);
      return cycle[idx];
    }
    function getShift(date) {
      return getShiftForTeam(date, $('teamSelect').value);
    }
    function pill(shift, textMode = 'label') {
      const span = document.createElement('span');
      span.className = `pill ${shift.key}`;
      span.textContent = shift[textMode];
      return span;
    }
    function renderToday() {
      const today = new Date();
      const shift = getShift(today);
      $('todayDate').textContent = `${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()} (${['日','月','火','水','木','金','土'][today.getDay()]})`;
      $('todayShift').innerHTML = '';
      $('todayShift').appendChild(pill(shift));
      let next = null;
      for (let i = 1; i <= 20; i++) {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
        if (getShift(d).key === 'off') { next = i; break; }
      }
      $('nextOff').textContent = shift.key === 'off' ? '今日は休み。' : `次の休みまで ${next} 日`;
      const selected = state.selectedDate ? new Date(state.selectedDate + 'T00:00:00') : today;
      renderAllTeams(selected);
    }
    function renderAllTeams(date) {
      const box = $('allTeams');
      if (!box) return;
      const label = $('selectedDateLabel');
      if (label) label.textContent = `選択日：${formatJaDate(date)}`;
      box.innerHTML = '';
      ['A','B','C','D'].forEach(team => {
        const wrap = document.createElement('div');
        wrap.className = 'team-chip';
        const name = document.createElement('b');
        name.textContent = team;
        wrap.appendChild(name);
        wrap.appendChild(pill(getShiftForTeam(date, team), 'short'));
        box.appendChild(wrap);
      });
    }
    function renderCalendar() {
      renderToday();
      const year = state.view.getFullYear();
      const month = state.view.getMonth();
      $('monthLabel').textContent = `${year}年 ${month + 1}月`;
      const cal = $('calendar');
      cal.innerHTML = '';
      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      for (let i = 0; i < first.getDay(); i++) {
        const blank = document.createElement('div');
        blank.className = 'day blank';
        cal.appendChild(blank);
      }
      const todayKey = ymd(new Date());
      for (let day = 1; day <= last.getDate(); day++) {
        const d = new Date(year, month, day);
        const key = ymd(d);
        const shift = getShift(d);
        const cell = document.createElement('button');
        cell.className = 'day' + (key === todayKey ? ' today' : '') + (key === state.selectedDate ? ' selected' : '');
        cell.type = 'button';
        const num = document.createElement('div');
        num.className = 'date-num' + (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '');
        num.textContent = day;
        cell.appendChild(num);
        cell.appendChild(pill(shift, 'short'));
        const memo = document.createElement('div');
        memo.className = 'memo-dot';
        memo.textContent = state.memos[key] ? `📝 ${state.memos[key].replace(/\s+/g, ' ')}` : '';
        memo.title = state.memos[key] || '';
        cell.appendChild(memo);
        cell.addEventListener('click', () => openMemo(d));
        cal.appendChild(cell);
      }
    }
    function openMemo(date) {
      state.selectedDate = ymd(date);
      renderCalendar(); // 保存せず閉じても、選択日として反映する
      const shift = getShift(date);
      $('modalDate').textContent = formatJaDate(date);
      $('modalShift').innerHTML = '';
      $('modalShift').appendChild(pill(shift));
      $('memoInput').value = state.memos[state.selectedDate] || '';
      renderAllTeams(date);
      $('memoDialog').showModal();
    }
    function saveMemos() {
      localStorage.setItem('shiftMemos', JSON.stringify(state.memos));
    }
    $('prevBtn').addEventListener('click', () => { state.view.setMonth(state.view.getMonth() - 1); renderCalendar(); });
    $('nextBtn').addEventListener('click', () => { state.view.setMonth(state.view.getMonth() + 1); renderCalendar(); });
    $('todayBtn').addEventListener('click', () => { state.view = new Date(); state.selectedDate = ymd(new Date()); renderCalendar(); });
    $('resetBtn').addEventListener('click', () => {
      localStorage.removeItem('shiftTeam');
      localStorage.removeItem('shiftBaseDate');
      $('teamSelect').value = 'A';
      $('baseDate').value = '2026-06-01';
      renderCalendar();
    });
    $('teamSelect').addEventListener('change', () => { localStorage.setItem('shiftTeam', $('teamSelect').value); renderCalendar(); });
    $('baseDate').addEventListener('change', () => { localStorage.setItem('shiftBaseDate', $('baseDate').value); renderCalendar(); });
    $('closeModalBtn').addEventListener('click', () => $('memoDialog').close());
    $('saveMemoBtn').addEventListener('click', () => {
      const text = $('memoInput').value.trim();
      if (text) state.memos[state.selectedDate] = text;
      else delete state.memos[state.selectedDate];
      saveMemos();
      $('memoDialog').close();
      renderCalendar();
    });
    $('deleteMemoBtn').addEventListener('click', () => {
      delete state.memos[state.selectedDate];
      saveMemos();
      $('memoDialog').close();
      renderCalendar();
    });
    $('teamSelect').value = localStorage.getItem('shiftTeam') || 'A';
    $('baseDate').value = localStorage.getItem('shiftBaseDate') || '2026-06-01';
    renderCalendar();
  </script>
</body>
</html>
